<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Count app</title>
        <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
        <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
        <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    
    <div id="root"></div>

    <script type="text/babel">
        const {useState}=React;

    const App=()=>{

        const [count,setCount]=useState(0)

        const handleIncrement=()=>{
            setCount((prevCount)=>prevCount+1)
        }
        const handleDecrement=()=>{
            setCount((prevCount)=>prevCount-1)
        }

        const handleResert=()=>{
            setCount((prevCount)=>0)
        }


        return(
            <>
            <div style={{display:'flex',flexDirection:'column',alignItems:'center', justifyContent:'center',gap:'10px'}}>
            <h1 style={{fontSize:'30px',margin:'10px',textAlign:'center',fontWeight:'bold',color:'#007bff'}}>Count App</h1>
             <p style={{fontSize:'20px',margin:'10px',textAlign:'center'}}>Count: {count}</p>
            <div style={{display:'flex',flexDirection:'row',alignItems:'center',margin:'10px',justifyContent:'center',gap:'10px'}}>
            <button onClick={handleIncrement} style={{padding:'8px',marginTop:'10px',backgroundColor:'#007bff',color:'white',border:'none'}}>Increment</button>
          <button onClick={handleDecrement} style={{ padding: '8px', marginTop: '10px', backgroundColor: '#007bff', color: 'white', border: 'none' }}>Decrement</button>
         <button onClick={handleResert} style={{ padding: '8px', marginTop: '10px', backgroundColor: '#007bff', color: 'white', border: 'none' }}>Reset</button>
         </div>

          </div>
            </>
        )

    }


   ReactDOM.createRoot(document.getElementById('root')).render(<App/>)   
              </script>
</body>
</html>
