<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Todo List</title>
        <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
        <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script> 
        <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const {useState}=React;

        const App=()=>{

            const [tasks,setTasks]=useState(["Learn React","Learn JavaScript","Learn Node.js"])
            const [title, setTitle] = useState("");
            const handleSubmit=(e)=>{
                e.preventDefault()
                alert("Submit working");
                setTasks([...tasks,title])
                setTitle("")
            }

            const handleDeleteTask=(e)=>{
                e.preventDefault()
                alert("Delete working");
                setTasks([])
            }

            return(
                <>
                <div style={{display:'flex',flexDirection:'column',alignItems:'center'}}>
                   <input type="text" value={title} name="title" placeholder="Enter Task Name" onChange={(e)=>setTitle(e.target.value)} style={{padding:"8px"}}/>
                   <div style={{display:'flex',flexDirection:'row',alignItems:'center',margin:'10px',justifyContent:'center',gap:'10px'}}>
                    <button onClick={(e)=>handleSubmit(e)} style={{ padding: "8px", marginTop: '10px', backgroundColor: '#007bff', color: 'white', border: 'none' }}>Add Task</button>
                    <button  onClick={handleDeleteTask} style={{ padding: "8px", marginTop: '10px', backgroundColor: '#007bff', color: 'white', border: 'none' }}>Clear ALL</button>
                    </div>
                    <Tasks tasks={tasks}/>

                    </div>
                </>
            )
        }


        const Tasks=({tasks})=>{
             
            return(
                
            
                   
                   <ul style={{display:'flex',flexDirection:'column',alignItems:'center',margin:'10px',justifyContent:'center',gap:'10px'}}>
                        {tasks.map((task,index)=><li key={index}>{task}</li>)}  
                    </ul>      
                        
            )
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App/>)
        </script>
</body>
</html>
