<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>buttons toggle</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        #root{
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            background-color:black;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const root=ReactDOM.createRoot(document.getElementById("root"));
       const {useState}=React

      function App(){
          const[color,setColor]=useState("green")


              const toggleColor=()=>{
                setColor((prevColor)=>(prevColor==="green"?"yellow":"green"))
              }

    

          return(
            <div style={{display:'flex',justifyContent:'center',alignItems:'center',height:'100vh',backgroundColor:'black',flexDirection:'column'}}>

                <button onClick={toggleColor}  style={{backgroundColor:color,fontSize:"50px"}}>Toggle</button>


                <p  style={{fontSize:'50px',color:'white'}}>{color}</p>
            </div>
          )
      }
      root.render(<App/>)

    </script>
</body>
</html>
