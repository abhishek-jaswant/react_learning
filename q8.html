<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic List of Users</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        // Component to render individual user details
        const UserCard = ({ name, email, age }) => {
            return (
                <div style={{ border: '1px solid #ccc', padding: '10px', borderRadius: '5px', marginBottom: '8px', display: 'flex', flexDirection: 'column', gap: '5px', boxShadow:'2px 2px 2px 2px lightgray', alignItems:'center',justifyContent:'center' }}>
                    <h3>{name}</h3>
                    <p>Email: {email}</p>
                    <p>Age: {age}</p>
                </div>
            );
        };

        // Component that accepts users array as prop and renders list of UserCards
        const UserList = ({ users }) => {
            if (!users || users.length === 0) {
                return <p>No users added yet.</p>;
            }

            return (
                <div>
                    <h2>User List</h2>
                    {users.map((user) => (
                        <UserCard
                            key={user.id}
                            name={user.name}
                            email={user.email}
                            age={user.age}
                        />
                    ))}
                </div>
            );
        };

     
        const App = () => {
            const [users, setUsers] = useState([]);
            const [name, setName] = useState('');
            const [email, setEmail] = useState('');
            const [age, setAge] = useState('');
            const [error, setError] = useState('');

            const handleAddUser = (e) => {
                e.preventDefault();

                // 1. Validation checks
                if (!name.trim()) {
                    setError('Name should not be empty.');
                    return;
                }

                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                if (!emailRegex.test(email)) {
                    setError('Please enter a valid email format.');
                    return;
                }

                const parsedAge = Number(age);
                if (!age || isNaN(parsedAge) || parsedAge <= 0 || !Number.isInteger(parsedAge)) {
                    setError('Age should be a positive integer.');
                    return;
                }

                // Clear any error if validations pass
                setError('');

                // 2. Add user object with unique ID
                const newUser = {
                    id: Date.now(),
                    name: name.trim(),
                    email: email.trim(),
                    age: parsedAge
                };

                setUsers([...users, newUser]);

                // 3. Reset form fields
                setName('');
                setEmail('');
                setAge('');
            };

            return (
                <div style={{ padding: '20px', maxWidth: '400px', margin: '0 auto' }}>
                    <h1>Add New User</h1>

                    {error && <p style={{ color: 'red', fontWeight: 'bold' }}>{error}</p>}

                    <form onSubmit={handleAddUser} style={{ display: 'flex', flexDirection: 'column', gap: '10px', marginBottom: '20px' }}>
                        <input
                            type="text"
                            placeholder="Enter Name"
                            value={name}
                            onChange={(e) => setName(e.target.value)}
                        />
                        <input
                            type="text"
                            placeholder="Enter Email"
                            value={email}
                            onChange={(e) => setEmail(e.target.value)}
                        />
                        <input
                            type="number"
                            placeholder="Enter Age"
                            value={age}
                            onChange={(e) => setAge(e.target.value)}
                        />
                        <button type="submit" style={{ backgroundColor: 'blue', color: 'white', padding: '8px', cursor: 'pointer' }}>
                            Add User
                        </button>
                    </form>

                    <hr />

                    {/* UserList component receives array as prop */}
                    <UserList users={users} />
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>

</html>
