<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fetch and Render Product Cards on Button Click</title>
        <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
        <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
        <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

        <style>
            body {
                font-family: Arial, sans-serif;
                margin: 0;
                padding: 0;
                background-color: #f2f2f2;
            }
            .spinner {
                width: 50px;
                height: 50px;
                border: 5px solid #ddd;
                border-top: 5px solid blue;
                border-radius: 50%;
                animation: spin 1s linear infinite;
                text-align: center;
                justify-content: center;
                align-items: center;
            }
        
            @keyframes spin {
                from {
                    transform: rotate(0deg);
                }
        
                to {
                    transform: rotate(360deg);
                }
            }
        </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const {useState}=React;
        const App=()=>{

            const [data,setData]=useState([])
            const [Loading,setLoading]=useState(false)
            const [Error,setError]=useState("")

            const handleFetchData= async(e)=>{
                e.preventDefault()
                try {
                    setLoading(true)
                    const response = await fetch('https://fakestoreapi.com/products')

                    const data = await response.json()

                    console.log(data)
                    setData(data)
                
                   
                    setLoading(false)
                    setError("")
                } catch (error) {
                    setError(error.message) 
                }
            }

            if(Loading)
            {
                return(<p className="spinner">Data is Loading...</p>)
            }

             if(Error)
             {
                return(<p> Error: {Error}</p>)
             }

          
           
            return(
                <>
                <div style={{display:'flex',flexDirection:'row',alignItems:'center',justifyContent:'center',gap:'10px',with:"fit-content",height:"fit-content",backgroundColor:"lightgray"}}>
                <button  style={{with:"20px",hight:"20px",fontSize:"20px",backgroundColor:"blue",color:"white",border:"none",borderRedius:"5px"}} onClick={(e)=>handleFetchData(e)}>Fetch Data</button>
               </div> 

                <div style={{ display: "grid",
                    gridTemplateColumns: "repeat(auto-fit, minmax(300px, 1fr))",
                    gap: "10px",
                    width: "100%",
                    padding: "20px"}}>
                    {data.map((product, index) => (
                        <div key={index} style={{ backgroundColor: "white", borderRadius: "10px", boxShadow: "0 0 5px rgba(0,0,0,0.1)", padding: "20px",alignItems:"center",justifyContent:"center" }}>
                            <img src={product.image} alt={product.name} style={{ width: "100px", height: "100px", objectFit: "contain" }} />
                            <h2 style={{ margin: "0" }}>{product.name}</h2>
                            <p style={{ margin: "10px 0" }}>{product.description}</p>
                            <p style={{ margin: "10px 0" }}>Price: ${product.price}</p>
                            <button style={{ backgroundColor: "blue", color: "white", border: "none", borderRadius: "5px", padding: "10px 20px" }}>Buy Now</button>
                        </div>
                    ))}
                    </div>
                </>
            )
        }
            ReactDOM.createRoot(document.getElementById('root')).render(<App/>)
    </script>
</body>
</html>
