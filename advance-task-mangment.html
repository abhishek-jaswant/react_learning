<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Task Manager with Prioritization</title>
        <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
        <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
        <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
   
    <div id="root"></div>

    <script type="text/babel">
        const {useState}=React;

    const App=()=>{

        const [tasks,setTasks]=useState([])
        const [title, setTitle] = useState("");
        const [priority, setPriority] = useState("Low");
        const [selectedPriority, setSelectedPriority] = useState("All");

        const filteredTasks =
            selectedPriority === "All"
                ? tasks
                : tasks.filter((task) => task.priority === selectedPriority);

        const handleSubmit=(e)=>{
            e.preventDefault()
             alert("Submit working");

              let obj={
                id:new Date().getTime(),
                title:title,
                priority:priority,
                completed:false

            }

            setTasks([...tasks,obj])
            setTitle("")
            setPriority("Low")

            console.log(tasks)
        }

        const handleComplete=(taskId)=>{
           
           
            setTasks((prevTasks)=>prevTasks.map((task)=>task.id===taskId?{...task,completed:!task.completed}:task))
            alert("Completed");
        }

        const handleDeleteTask=(taskId)=>{
           
            setTasks((prevTasks)=>prevTasks.filter((task)=>task.id!==taskId))
          alert("Deleted");
           
        }

      
             

        
          
           

           
        

        return(
            <>
            <form onSubmit={handleSubmit} style={{display:'flex',flexDirection:'column',alignItems:'center'}}>

                <h1 style={{fontSize:'30px',margin:'10px',textAlign:'center',fontWeight:'bold',color:'#007bff'}}>Task Manager</h1>

                <input type="text" value={title} name="title" placeholder="Enter Task Name" onChange={(e)=>setTitle(e.target.value)} style={{padding:"8px"}}/>
               

                   <select value={priority} name="priority" onChange={(e) => setPriority(e.target.value)} style={{ padding: "8px" }}>

                        <option value="High">High</option>
                        <option value="Medium">Medium</option>
                        <option value="Low">Low</option>
                    </select>
                    <button type="submit" style={{ padding: "8px", marginTop: '10px', backgroundColor: '#007bff', color: 'white', border: 'none' }}>Add Task</button>
                <br/>
                <p>Select Priority</p>

                    <select value={selectedPriority} name="selectedPriority" onChange={(e) => setSelectedPriority(e.target.value)} style={{ padding: "8px" }}>
                        <option value="All">All</option>
                        <option value="High">High</option>
                        <option value="Medium">Medium</option>
                        <option value="Low">Low</option>
                    </select>


               
                </form>
                <TaskList filterTasks={filteredTasks} onToggleComplate={handleComplete} onDeleteTask={handleDeleteTask}/>
            </>
        )

    
      }

    const TaskCard=({filterTask,onToggleComplate,onDeleteTask})=>{
   
   
        return(
            <div style={{display:'flex',flexDirection:'column',alignItems:'center',margin:'10px',padding:'10px',border:'1px solid #007bff',borderRadius:'5px',backgroundColor:filterTask.completed?'blue':'red',boxShadow: filterTask.priority== "High" ? '3px 3px 3px 3px #007bff':'2px 2px 2px 2px #007bff'}}>
                <h2 style={{fontSize:'20px',margin:'5px',textAlign:'center'}}>{filterTask.title}</h2>
                <p style={{fontSize:'16px',margin:'5px',textAlign:'center'}}>Priority: {filterTask.priority}</p>
                <button  onClick={() => onToggleComplate(filterTask.id)} style={{padding:'8px',marginTop:'10px',backgroundColor:'#007bff',color:'white',border:'none'}}>{filterTask.completed?'Uncomplete':'Complete'}</button>
                <button onClick={()=>onDeleteTask(filterTask.id)} style={{padding:'8px',marginTop:'10px',backgroundColor:'#007bff',color:'white',border:'none'}}>Delete</button>
            </div>
        )
    }
    
    const TaskList=({filterTasks,onToggleComplate,onDeleteTask})=>{
        return(
            <div style={{display:'flex',flexDirection:'column',alignItems:'center',margin:'10px'}}>
                <h1 style={{fontSize:'20px',margin:'5px',textAlign:'center'}}>Task List</h1>
                <div style={{display:'flex',flexDirection:'column',alignItems:'center',margin:'5px'}}>
                    {filterTasks.map((task,index)=><TaskCard key={index} filterTask={task} onToggleComplate={onToggleComplate} onDeleteTask={onDeleteTask}/>)}
                </div>
            </div>
        )
    }


   ReactDOM.createRoot(document.getElementById('root')).render(<App/>)
    </script>
</body>
</html>
